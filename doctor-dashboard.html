<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard - HealthSync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="db.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  
  <nav class="bg-white shadow-sm border-b-4 border-indigo-600">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-2">
          <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
          <span class="text-xl font-bold text-indigo-600">HealthSync Portal</span>
        </div>
        <div class="flex items-center gap-4">
          <span id="user-greeting" class="text-gray-700 font-medium"></span>
          <button onclick="logoutUser()" class="text-sm text-red-600 hover:text-red-800 font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">All Appointments</h2>
        <span class="text-sm text-gray-500">Manage patient requests</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient Name</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date & Time</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reason</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="appointments-tbody" class="bg-white divide-y divide-gray-200">
            <!-- Rows rendered here -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const user = getCurrentUser();
    if (!user || user.role !== 'Doctor') {
      window.location.href = 'login.html';
    }

    document.getElementById('user-greeting').textContent = 'Welcome, Dr. ' + user.name;

    function renderAppointments() {
      const appointments = getAllAppointments();
      const tbody = document.getElementById('appointments-tbody');
      
      if (appointments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500 italic">No appointments in the system.</td></tr>';
        return;
      }

      tbody.innerHTML = appointments.map(apt => `
        <tr>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${apt.patientName}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${apt.date} at ${apt.time}</td>
          <td class="px-6 py-4 text-sm text-gray-500">${apt.reason}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
              ${apt.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 
                apt.status === 'Confirmed' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
              ${apt.status}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            ${apt.status === 'Pending' ? `
              <button onclick="updateStatus('${apt.id}', 'Confirmed')" class="text-indigo-600 hover:text-indigo-900 mr-3">Approve</button>
              <button onclick="updateStatus('${apt.id}', 'Declined')" class="text-red-600 hover:text-red-900">Decline</button>
            ` : `
              <span class="text-gray-400">Processed</span>
            `}
          </td>
        </tr>
      `).reverse().join('');
    }

    window.updateStatus = function(id, status) {
      updateAppointmentStatus(id, status);
      renderAppointments();
    };

    // Initial render
    renderAppointments();
  </script>
</body>
</html>
