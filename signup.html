<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthSync - Create an account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex bg-gray-50">

  <!-- Left Side: Signup Form -->
  <div class="w-full lg:w-1/2 flex flex-col justify-center px-12 sm:px-24 xl:px-32 bg-gray-50">
    <div class="max-w-md w-full mx-auto">
      
      <!-- Logo -->
      <div class="flex items-center gap-2 mb-8">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        <span class="text-2xl font-bold text-blue-600">HealthSync</span>
      </div>

      <!-- Heading -->
      <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Create an account</h2>
      <p class="text-sm text-gray-600 mb-8">
        Already have an account? <a href="login.html" class="font-medium text-blue-600 hover:text-blue-500">Sign in instead</a>
      </p>

      <!-- Form -->
      <form class="space-y-4" action="#" method="POST">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
          <div class="mt-1">
            <input id="name" name="name" type="text" autocomplete="name" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1">
            <input id="password" name="password" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label for="role" class="block text-sm font-medium text-gray-700">I am a...</label>
          <div class="mt-1">
            <select id="role" name="role" class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md border">
              <option>Patient</option>
              <option>Doctor</option>
            </select>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Create Account
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Right Side: Image -->
  <div class="hidden lg:block relative w-1/2">
    <!-- Using an image of a doctor holding a stethoscope, matching the screenshot -->
    <img class="absolute inset-0 h-full w-full object-cover" src="https://images.unsplash.com/photo-1581595220892-b0739db3ba8c?auto=format&fit=crop&q=80&w=2000" alt="Doctor with stethoscope">
  </div>

</body>
</html>
